<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OptiVerse Control Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text:#283247;
            --muted:#7c879b;
            --brand:#ef9f9f;
            --mint:#9be7cf;
            --lavender:#c9b7ff;
            --line:#eadbd0;
            --red:#e75d74;
        }
        * { box-sizing:border-box; }
        body {
            margin:0;
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:22px;
            color:var(--text);
            font-family:"Space Grotesk","Trebuchet MS",sans-serif;
            background:
                radial-gradient(circle at 13% 10%, rgba(239,159,159,.34), transparent 28%),
                radial-gradient(circle at 88% 18%, rgba(201,183,255,.30), transparent 24%),
                radial-gradient(circle at 58% 92%, rgba(155,231,207,.32), transparent 28%),
                linear-gradient(135deg,#fff8f2 0%,#f7fbff 52%,#fff5ed 100%);
        }
        body:before {
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            opacity:.34;
            background-image:
                linear-gradient(rgba(94,73,96,.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(94,73,96,.04) 1px, transparent 1px);
            background-size:44px 44px;
        }
        .card {
            width:min(430px,94vw);
            padding:32px;
            border:1px solid var(--line);
            border-radius:28px;
            background:linear-gradient(145deg,rgba(255,253,249,.94),rgba(255,246,239,.90));
            box-shadow:0 28px 70px rgba(145,105,91,.20), inset 0 1px 0 rgba(255,255,255,.75);
            position:relative;
            overflow:hidden;
        }
        .card:after {
            content:"";
            position:absolute;
            right:-62px;
            top:-62px;
            width:180px;
            height:180px;
            border-radius:999px;
            background:rgba(239,159,159,.16);
        }
        .mark {
            width:42px;
            height:42px;
            border-radius:15px;
            background:conic-gradient(from 210deg,var(--brand),var(--lavender),var(--mint),var(--brand));
            box-shadow:0 10px 24px rgba(239,159,159,.26);
            margin-bottom:18px;
        }
        h1 { margin:0 0 8px; font-size:34px; line-height:.98; letter-spacing:-.055em; }
        .sub { color:var(--muted); margin:0 0 24px; }
        .field { margin-bottom:15px; }
        label {
            display:block;
            margin-bottom:7px;
            font-size:11px;
            font-weight:700;
            letter-spacing:.12em;
            color:#725985;
            text-transform:uppercase;
        }
        input {
            width:100%;
            padding:13px 14px;
            border-radius:15px;
            border:1px solid #dac8bd;
            background:rgba(255,255,255,.86);
            color:var(--text);
            font:inherit;
            outline:0;
        }
        input:focus { border-color:#dd8d9a; box-shadow:0 0 0 3px rgba(239,159,159,.18); }
        .btn {
            width:100%;
            padding:13px 16px;
            border:0;
            border-radius:15px;
            background:linear-gradient(135deg,#f7b4b4,#a8d8ff);
            color:#2b2430;
            font:700 15px/1 "Space Grotesk","Trebuchet MS",sans-serif;
            cursor:pointer;
            box-shadow:0 14px 28px rgba(239,159,159,.20);
        }
        .btn:hover { transform:translateY(-1px); }
        .err {
            padding:11px 13px;
            border-radius:14px;
            background:rgba(231,93,116,.13);
            border:1px solid rgba(231,93,116,.44);
            color:#b5213b;
            font-weight:700;
        }
    </style>
</head>
<body>
<form class="card" method="post">
    {% csrf_token %}
    <div class="mark"></div>
    <h1>OptiVerse Control</h1>
    <p class="sub">Owner-only tenant command center.</p>
    {% if form.errors %}<p class="err">Invalid username or password.</p>{% endif %}
    <div class="field"><label>Username</label>{{ form.username }}</div>
    <div class="field"><label>Password</label>{{ form.password }}</div>
    <button class="btn" type="submit">Login</button>
</form>
</body>
</html>
