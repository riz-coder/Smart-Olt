<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OptiVerse Control Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text:#f3fff8;
            --muted:#9fc2b8;
            --brand:#7df0ca;
            --amber:#f7c65c;
            --line:rgba(148,191,176,.28);
            --red:#ff6b7d;
        }
        * { box-sizing:border-box; }
        body {
            margin:0;
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:22px;
            color:var(--text);
            font-family:"Space Grotesk","Trebuchet MS",sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(125,240,202,.22), transparent 30%),
                radial-gradient(circle at 88% 18%, rgba(247,198,92,.16), transparent 24%),
                linear-gradient(135deg,#050b0b 0%,#0d2220 48%,#091013 100%);
        }
        body:before {
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            opacity:.22;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size:44px 44px;
        }
        .card {
            width:min(430px,94vw);
            padding:32px;
            border:1px solid var(--line);
            border-radius:28px;
            background:linear-gradient(145deg,rgba(17,39,36,.94),rgba(8,18,20,.92));
            box-shadow:0 28px 70px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
            position:relative;
            overflow:hidden;
        }
        .card:after {
            content:"";
            position:absolute;
            right:-62px;
            top:-62px;
            width:180px;
            height:180px;
            border-radius:999px;
            background:rgba(125,240,202,.10);
        }
        .mark {
            width:42px;
            height:42px;
            border-radius:15px;
            background:conic-gradient(from 210deg,var(--brand),var(--amber),#24433d,var(--brand));
            box-shadow:0 0 34px rgba(125,240,202,.30);
            margin-bottom:18px;
        }
        h1 { margin:0 0 8px; font-size:34px; line-height:.98; letter-spacing:-.055em; }
        .sub { color:var(--muted); margin:0 0 24px; }
        .field { margin-bottom:15px; }
        label {
            display:block;
            margin-bottom:7px;
            font-size:11px;
            font-weight:700;
            letter-spacing:.12em;
            color:#bdf3df;
            text-transform:uppercase;
        }
        input {
            width:100%;
            padding:13px 14px;
            border-radius:15px;
            border:1px solid rgba(125,240,202,.26);
            background:#071313;
            color:var(--text);
            font:inherit;
            outline:0;
        }
        input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(125,240,202,.12); }
        .btn {
            width:100%;
            padding:13px 16px;
            border:0;
            border-radius:15px;
            background:linear-gradient(135deg,var(--brand),#50c7ff);
            color:#06100f;
            font:700 15px/1 "Space Grotesk","Trebuchet MS",sans-serif;
            cursor:pointer;
            box-shadow:0 14px 28px rgba(71,183,255,.16);
        }
        .btn:hover { transform:translateY(-1px); }
        .err {
            padding:11px 13px;
            border-radius:14px;
            background:rgba(255,107,125,.15);
            border:1px solid rgba(255,107,125,.50);
            color:#ffd2d8;
            font-weight:700;
        }
    </style>
</head>
<body>
<form class="card" method="post">
    {% csrf_token %}
    <div class="mark"></div>
    <h1>OptiVerse Control</h1>
    <p class="sub">Owner-only tenant command center.</p>
    {% if form.errors %}<p class="err">Invalid username or password.</p>{% endif %}
    <div class="field"><label>Username</label>{{ form.username }}</div>
    <div class="field"><label>Password</label>{{ form.password }}</div>
    <button class="btn" type="submit">Login</button>
</form>
</body>
</html>
