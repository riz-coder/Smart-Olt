<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OptiVerse Control Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel:#121b2e;
            --line:#25344f;
            --text:#edf4ff;
            --muted:#9aa9bf;
            --blue:#3b82f6;
            --cyan:#24c6dc;
            --red:#ef4444;
        }
        * { box-sizing:border-box; }
        body {
            margin:0;
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:22px;
            color:var(--text);
            font:500 13px/1.45 "Manrope", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 14% 8%, rgba(36,198,220,.16), transparent 30%),
                radial-gradient(circle at 92% 20%, rgba(59,130,246,.13), transparent 26%),
                linear-gradient(135deg,#0b1220 0%,#101b2f 50%,#0a1020 100%);
        }
        .card {
            width:min(390px,94vw);
            padding:26px;
            border:1px solid var(--line);
            border-radius:18px;
            background:linear-gradient(145deg,rgba(18,27,46,.97),rgba(13,21,36,.96));
            box-shadow:0 24px 60px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.04);
        }
        .mark {
            width:32px;
            height:32px;
            border-radius:10px;
            background:linear-gradient(135deg,var(--cyan),var(--blue));
            box-shadow:0 0 24px rgba(36,198,220,.30);
            margin-bottom:16px;
        }
        h1 { margin:0 0 6px; font-size:25px; line-height:1.05; letter-spacing:-.04em; }
        .sub { color:var(--muted); margin:0 0 20px; font-size:12px; }
        .field { margin-bottom:13px; }
        label {
            display:block;
            margin-bottom:6px;
            color:#a8c4ef;
            font-size:10px;
            font-weight:800;
            letter-spacing:.09em;
            text-transform:uppercase;
        }
        input {
            width:100%;
            padding:10px 11px;
            border:1px solid #334766;
            border-radius:10px;
            background:#0b1424;
            color:var(--text);
            outline:0;
            font:600 13px/1.35 "Manrope", "Segoe UI", sans-serif;
        }
        input:focus { border-color:#60a5fa; box-shadow:0 0 0 3px rgba(59,130,246,.18); }
        .btn {
            width:100%;
            padding:11px 14px;
            border:0;
            border-radius:10px;
            background:linear-gradient(135deg,#2563eb,#24c6dc);
            color:white;
            cursor:pointer;
            font:800 12px/1 "Manrope", "Segoe UI", sans-serif;
            box-shadow:0 10px 24px rgba(37,99,235,.24);
        }
        .err {
            padding:10px 12px;
            border-radius:10px;
            background:rgba(239,68,68,.12);
            border:1px solid rgba(239,68,68,.42);
            color:#fda4af;
            font-weight:800;
        }
    </style>
</head>
<body>
<form class="card" method="post">
    {% csrf_token %}
    <div class="mark"></div>
    <h1>OptiVerse Control</h1>
    <p class="sub">Owner-only tenant command center.</p>
    {% if form.errors %}<p class="err">Invalid username or password.</p>{% endif %}
    <div class="field"><label>Username</label>{{ form.username }}</div>
    <div class="field"><label>Password</label>{{ form.password }}</div>
    <button class="btn" type="submit">Login</button>
</form>
</body>
</html>
