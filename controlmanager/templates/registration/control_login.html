<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Control Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07111f,#123b67);font-family:Segoe UI,Tahoma,sans-serif;color:#edf6ff}.card{width:min(380px,92vw);padding:30px;border:1px solid #2b527e;border-radius:22px;background:#10203a;box-shadow:0 22px 50px rgba(0,0,0,.32)}h1{margin:0 0 8px}.sub{color:#9fb9dc;margin:0 0 22px}.field{margin-bottom:14px}label{display:block;margin-bottom:6px;font-size:12px;font-weight:900;color:#b9d3f7;text-transform:uppercase}input{width:100%;padding:12px;border-radius:10px;border:1px solid #3d6190;background:#07182d;color:#edf6ff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#2f80ff;color:white;font-weight:900;cursor:pointer}.err{padding:10px;border-radius:10px;background:rgba(190,18,60,.25);border:1px solid rgba(255,100,119,.55);font-weight:800}</style>
</head><body><form class="card" method="post">{% csrf_token %}<h1>OptiVerse Control</h1><p class="sub">Owner-only master control plane.</p>{% if form.errors %}<p class="err">Invalid username or password.</p>{% endif %}<div class="field"><label>Username</label>{{ form.username }}</div><div class="field"><label>Password</label>{{ form.password }}</div><button class="btn" type="submit">Login</button></form></body></html>
