<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Optiverse</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #f4fbff;
            background:
                radial-gradient(circle at 50% 52%, rgba(35, 142, 255, 0.2), transparent 34%),
                linear-gradient(135deg, #020f1e 0%, #05254a 48%, #010a16 100%);
            overflow: hidden;
        }

        .circuit {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 0 6%, rgba(17, 134, 255, 0.28) 6.2% 6.5%, transparent 6.7% 100%),
                linear-gradient(90deg, transparent 0 28%, rgba(17, 134, 255, 0.22) 28.2% 28.5%, transparent 28.7% 100%),
                linear-gradient(90deg, transparent 0 75%, rgba(17, 134, 255, 0.25) 75.2% 75.5%, transparent 75.7% 100%),
                linear-gradient(0deg, transparent 0 18%, rgba(17, 134, 255, 0.2) 18.2% 18.5%, transparent 18.7% 100%),
                linear-gradient(0deg, transparent 0 62%, rgba(17, 134, 255, 0.22) 62.2% 62.5%, transparent 62.7% 100%);
            opacity: 0.9;
        }

        .circuit::before,
        .circuit::after {
            content: "";
            position: absolute;
            inset: 3% 0;
            background-image:
                linear-gradient(45deg, transparent 0 47%, rgba(25, 143, 255, 0.34) 47.5% 48.2%, transparent 48.7% 100%),
                linear-gradient(-45deg, transparent 0 52%, rgba(16, 96, 196, 0.38) 52.4% 53%, transparent 53.4% 100%),
                radial-gradient(circle, rgba(31, 161, 255, 0.55) 0 2px, transparent 3px);
            background-size: 170px 170px, 210px 210px, 42px 42px;
            background-position: 0 0, 30px 20px, 14px 12px;
            mask-image: linear-gradient(90deg, rgba(0,0,0,.9), rgba(0,0,0,.25) 45%, rgba(0,0,0,.9));
        }

        .circuit::after {
            transform: scaleX(-1);
            opacity: 0.55;
        }

        .login-shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 22px;
        }

        .login-card {
            width: min(330px, 100%);
            padding: 28px 30px 26px;
            border: 1px solid rgba(187, 244, 255, 0.35);
            border-radius: 24px;
            background:
                linear-gradient(180deg, rgba(173, 236, 255, 0.72) 0%, rgba(48, 150, 236, 0.62) 42%, rgba(45, 91, 226, 0.74) 100%);
            box-shadow: 0 24px 58px rgba(0, 8, 30, 0.62), inset 0 1px 0 rgba(255,255,255,0.38);
            backdrop-filter: blur(14px);
        }

        .brand {
            margin: 0;
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0;
            text-shadow: 0 1px 14px rgba(255,255,255,0.34);
        }

        .tagline {
            margin: 7px 0 21px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: rgba(239, 252, 255, 0.92);
        }

        .auth-error {
            margin: 0 0 12px;
            padding: 9px 11px;
            border-radius: 10px;
            background: rgba(255, 58, 91, 0.17);
            border: 1px solid rgba(255, 156, 176, 0.55);
            color: #fff5f7;
            font-size: 12px;
            font-weight: 700;
        }

        .field {
            position: relative;
            margin-bottom: 14px;
        }

        .field input {
            width: 100%;
            height: 40px;
            border: 1px solid rgba(130, 244, 255, 0.38);
            border-radius: 7px;
            outline: none;
            padding: 0 13px;
            color: #eafcff;
            background: rgba(88, 224, 236, 0.62);
            box-shadow: inset 0 1px 8px rgba(255,255,255,0.16);
            font-size: 13px;
        }

        .field input::placeholder { color: rgba(245, 255, 255, 0.7); }
        .field input:focus {
            border-color: rgba(255,255,255,0.9);
            box-shadow: 0 0 0 3px rgba(108, 206, 255, 0.23);
        }

        .password-field input { padding-right: 58px; }

        .show-password {
            position: absolute;
            right: 8px;
            top: 7px;
            height: 26px;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,0.74);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 2px 0 15px;
            font-size: 12px;
            color: rgba(255,255,255,0.9);
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            width: 13px;
            height: 13px;
            accent-color: #6fe8ff;
        }

        .login-button {
            width: 100%;
            height: 42px;
            border: 0;
            border-radius: 7px;
            color: #ffffff;
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
            background: linear-gradient(180deg, #b9f7ff 0%, #5caefe 54%, #327dff 100%);
            box-shadow: 0 10px 24px rgba(18, 73, 203, 0.42), inset 0 1px 0 rgba(255,255,255,0.55);
            text-shadow: 0 1px 10px rgba(255,255,255,0.55);
        }

        .login-button:hover {
            filter: brightness(1.05);
        }

        @media (max-width: 520px) {
            .login-card {
                width: min(310px, 100%);
                padding: 25px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="circuit" aria-hidden="true"></div>
    <main class="login-shell">
        <section class="login-card" aria-label="Login">
            <h1 class="brand">Optiverse</h1>
            <p class="tagline">Smart Solution For Huwei OLT</p>

            {% if form.errors %}
                <div class="auth-error">Invalid username or password.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="field">
                    <input type="text" name="username" id="id_username" placeholder="E-mail or Username" autocomplete="username" required autofocus>
                </div>
                <div class="field password-field">
                    <input type="password" name="password" id="id_password" placeholder="Password" autocomplete="current-password" required>
                    <button type="button" class="show-password" id="toggle-password">Show</button>
                </div>
                <div class="form-row">
                    <label class="remember" for="remember_me">
                        <input type="checkbox" name="remember_me" id="remember_me">
                        <span>Remember me</span>
                    </label>
                </div>
                <button type="submit" class="login-button">Log In</button>
            </form>
        </section>
    </main>

    <script>
        const toggle = document.getElementById('toggle-password');
        const password = document.getElementById('id_password');
        toggle.addEventListener('click', () => {
            const isPassword = password.type === 'password';
            password.type = isPassword ? 'text' : 'password';
            toggle.textContent = isPassword ? 'Hide' : 'Show';
        });
    </script>
</body>
</html>
