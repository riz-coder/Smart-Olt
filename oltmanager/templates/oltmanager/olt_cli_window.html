{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLI - {{ olt.name }}</title>
    <link rel="stylesheet" href="{% static 'oltmanager/vendor/xterm.css' %}">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #000; }
        #term { height: 100vh; width: 100vw; }
        .xterm { padding: 8px 10px; }
        .xterm-viewport::-webkit-scrollbar { width: 10px; }
        .xterm-viewport::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 6px; }
    </style>
</head>
<body>
    <input type="hidden" id="cliCsrfToken" value="{{ csrf_token }}">
    <div id="term"></div>

    <script src="{% static 'oltmanager/vendor/xterm.js' %}"></script>
    <script src="{% static 'oltmanager/vendor/addon-fit.js' %}"></script>
    <script>
    (() => {
        const term = new Terminal({
            cursorBlink: true,
            fontFamily: 'Consolas, "Courier New", monospace',
            fontSize: 14,
            scrollback: 8000,
            // Treat a bare LF as CR+LF so the device's line breaks return to
            // column 0 (otherwise the prompt "stair-steps" to the right).
            convertEol: true,
            theme: { background: '#000000', foreground: '#a7fca7', cursor: '#a7fca7' },
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('term'));
        const safeFit = () => { try { fitAddon.fit(); } catch (e) {} };
        safeFit();
        term.focus();
        window.addEventListener('resize', safeFit);

        const csrf = document.getElementById('cliCsrfToken').value;
        const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = `${wsScheme}://${window.location.host}/ws/olt/{{ olt.pk }}/cli/`;
        const openUrl = "{% url 'olt_cli_open' olt.pk %}";
        const runUrl = "{% url 'olt_cli_run' olt.pk %}";
        const closeUrl = "{% url 'olt_cli_close' olt.pk %}";

        let socket = null;
        let connected = false;
        let mode = 'ws';
        let wsEverConnected = false;
        let httpConnectInProgress = false;
        let httpQueue = Promise.resolve();

        const post = async (url, data = {}) => {
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                    'X-CSRFToken': csrf,
                },
                body: new URLSearchParams(data).toString(),
            });
            return res.json();
        };

        term.write('Connecting...\r\n');

        // Every keystroke (printable chars, Enter=\r, Backspace=\x7f, Tab=\t, '?',
        // arrow keys as ESC sequences, Ctrl-C=\x03) is sent raw to the device.
        // The device echoes + handles its own line editing; we just render it.
        term.onData((data) => {
            if (!connected) return;
            if (mode === 'ws') {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'input', data }));
                }
            } else {
                httpQueue = httpQueue.then(() => sendInputHttp(data));
            }
        });

        const sendInputHttp = async (data) => {
            if (!connected) return;
            try {
                const result = await post(runUrl, { data });
                if (result.ok) {
                    if (result.output) term.write(result.output);
                } else {
                    term.write(`\r\n${result.message || 'Command failed.'}\r\n`);
                }
            } catch {
                term.write('\r\nRequest failed.\r\n');
            }
        };

        const connectHttp = async () => {
            if (httpConnectInProgress) return;
            httpConnectInProgress = true;
            mode = 'http';
            term.reset();
            term.write('Connecting (HTTP fallback)...\r\n');
            try {
                const result = await post(openUrl);
                if (!result.ok) {
                    connected = false;
                    term.write(`\r\n${result.message || 'Connect failed.'}\r\n`);
                    return;
                }
                connected = true;
                term.reset();
                term.write(result.output || '');
                term.focus();
            } catch {
                connected = false;
                term.write('\r\nConnection error.\r\n');
            } finally {
                httpConnectInProgress = false;
            }
        };

        const connectWs = () => {
            mode = 'ws';
            socket = new WebSocket(wsUrl);

            const wsTimeout = setTimeout(() => {
                if (!wsEverConnected && socket && socket.readyState !== WebSocket.OPEN) {
                    try { socket.close(); } catch {}
                    connectHttp();
                }
            }, 2500);

            socket.onopen = () => {
                clearTimeout(wsTimeout);
                connected = true;
                wsEverConnected = true;
                term.reset();
                term.focus();
            };

            socket.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data || '{}');
                    if (payload.type === 'output') term.write(payload.data || '');
                } catch {
                    term.write(event.data || '');
                }
            };

            socket.onerror = () => {
                if (!wsEverConnected) connectHttp();
            };

            socket.onclose = () => {
                clearTimeout(wsTimeout);
                connected = false;
                if (!wsEverConnected) {
                    connectHttp();
                } else {
                    term.write('\r\n\x1b[33mSession closed.\x1b[0m\r\n');
                }
            };
        };

        const disconnect = () => {
            if (mode === 'http') {
                post(closeUrl).catch(() => {});
                connected = false;
                return;
            }
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                socket.close();
            }
            connected = false;
        };

        window.addEventListener('beforeunload', disconnect);
        connectWs();
    })();
    </script>
</body>
</html>
