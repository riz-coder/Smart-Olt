<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OLT Portal{% endblock %}</title>
    <script>
        // Apply the saved theme before paint to avoid a flash of the wrong theme.
        (function () {
            try {
                if (localStorage.getItem('oltTheme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a1222;
            --card: #111d35;
            --text: #e8f0ff;
            --muted: #9db0cf;
            --line: #223556;
            --primary: #2f80ff;
            --primary-dark: #1f65d1;
            --success-bg: #12372a;
            --success-text: #87efac;
            --error-bg: #3a1520;
            --error-text: #ffb7c5;
            --danger: #ff6b77;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 92% 8%, #1b3e82 0%, transparent 36%),
                radial-gradient(circle at 8% 90%, #1d5a8a 0%, transparent 44%),
                var(--bg);
        }
        body.authenticated {
            padding-left: 244px;
        }
        /* The dashboard is laid out for large monitors; on laptop-sized screens
           it opens oversized. Scale the whole app down to fit like a native app.
           (zoom keeps the fixed sidebar + content perfectly aligned.) */
        @media (max-width: 1600px) { body.authenticated { zoom: 0.9; } }
        @media (max-width: 1366px) { body.authenticated { zoom: 0.8; } }
        @media (max-width: 1180px) { body.authenticated { zoom: 0.72; } }
        .main-nav {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 228px;
            border-right: 1px solid #25406b;
            background:
                linear-gradient(120deg, rgba(20, 34, 58, 0.98), rgba(18, 42, 82, 0.94)),
                repeating-linear-gradient(
                    -35deg,
                    rgba(255, 255, 255, 0.07) 0 1px,
                    transparent 1px 40px
                );
            box-shadow: 0 10px 24px rgba(2, 8, 20, 0.45);
            z-index: 40;
        }
        .nav-inner {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 18px;
        }
        .nav-brand {
            color: #f4f7ff;
            text-decoration: none;
            font-family: "Sora", "Manrope", sans-serif;
            font-size: 30px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.04em;
            margin: 0;
            padding: 8px 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            transform: skewX(-7deg);
            text-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            flex: 1;
            flex-wrap: nowrap;
        }
        .nav-link {
            color: #deebff;
            text-decoration: none;
            font-size: 16px;
            padding: 12px 14px;
            border-radius: 12px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }
        .nav-link:hover { background: rgba(255, 255, 255, 0.12); }
        .nav-dropdown {
            position: relative;
        }
        .nav-dropdown > summary {
            list-style: none;
        }
        .nav-dropdown > summary::-webkit-details-marker { display: none; }
        .nav-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 140px;
            background: #122446;
            border: 1px solid #2b4c80;
            border-radius: 10px;
            padding: 6px;
            z-index: 30;
            box-shadow: 0 10px 24px rgba(3, 9, 22, 0.45);
        }
        .nav-menu a {
            display: block;
            color: #deebff;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-menu a:hover { background: #1f3a67; }
        .nav-logout {
            margin: auto 0 0;
        }
        .nav-logout-btn {
            color: #fff;
            font-size: 16px;
            width: 100%;
            justify-content: flex-start;
        }
        .shell {
            width: min(1360px, calc(100% - 28px));
            margin: 20px 0 28px 16px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(17, 29, 53, 0.9);
            backdrop-filter: blur(3px);
        }
        .brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .subtle { color: var(--muted); margin: 4px 0 0; }
        .topbar-actions { display: flex; gap: 10px; align-items: center; }
        .panel {
            margin-top: 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 26px rgba(3, 8, 18, 0.45);
        }
        .messages { list-style: none; padding: 0; margin: 0 0 12px; }
        .messages li {
            margin: 8px 0;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-weight: 600;
        }
        .messages li.success {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: #21573f;
        }
        .messages li.error {
            background: var(--error-bg);
            color: var(--error-text);
            border-color: #5a2430;
        }
        .messages li.warning {
            background: #3a3214;
            color: #ffe7a1;
            border-color: #6e5a1f;
        }
        .btn {
            appearance: none;
            border: 1px solid transparent;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
            padding: 11px 14px;
            cursor: pointer;
            transition: 0.18s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: #17b169; color: #fff; }
        .btn-success:hover { background: #129258; }
        .btn-secondary {
            background: #162541;
            border-color: var(--line);
            color: #d7e5ff;
        }
        .btn-secondary:hover { border-color: #375b95; }
        .btn-danger {
            background: #2f1920;
            border-color: #6f2f3b;
            color: var(--danger);
        }
        .btn-danger:hover {
            background: #43202b;
            border-color: #8c4050;
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
        }
        th { color: #9cb5db; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
        td.actions { white-space: nowrap; }
        .inline { display: inline; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .form-grid p { margin: 0; }
        .form-grid label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #c9daff;
        }
        .form-control {
            width: 100%;
            border: 1px solid #324e78;
            border-radius: 10px;
            padding: 10px 12px;
            font: inherit;
            background: #0d1a31;
            color: #e6efff;
        }
        .form-control:focus {
            outline: none;
            border-color: #4c8fff;
            box-shadow: 0 0 0 3px rgba(47, 128, 255, 0.2);
        }
        .helptext { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
        .errorlist {
            margin: 0 0 6px;
            color: #9a2525;
            font-size: 12px;
            padding-left: 16px;
        }
        @media (max-width: 760px) {
            body.authenticated { padding-left: 0; }
            .main-nav {
                position: static;
                width: auto;
                border-right: none;
                border-bottom: 1px solid #25406b;
            }
            .shell { width: calc(100% - 22px); margin: 18px auto; }
            .topbar { flex-direction: column; align-items: flex-start; }
            .form-grid { grid-template-columns: 1fr; }
            .nav-brand { font-size: 22px; }
            .nav-link, .nav-logout-btn { font-size: 13px; }
            .nav-inner {
                width: calc(100% - 20px);
                height: auto;
                margin-left: 10px;
                padding: 8px 0;
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }
            .nav-links {
                flex-direction: row;
                align-items: center;
                gap: 2px;
            }
            .nav-logout { margin: 0; }
            .nav-logout-btn { width: auto; justify-content: center; }
        }

        /* Theme toggle button */
        .nav-theme {
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            color: #deebff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .nav-theme:hover { background: rgba(255, 255, 255, 0.14); }
        .nav-theme .theme-ico { font-size: 16px; line-height: 1; }

        /* ============================ LIGHT THEME ============================ */
        html[data-theme="light"] {
            --bg: #d8e6f5;
            --card: #ffffff;
            --text: #0c1c38;
            --muted: #3d5270;
            --line: #afc6e4;
            --primary: #1a6ef5;
            --primary-dark: #0f58d6;
            --success-bg: #d4f5e4;
            --success-text: #0a6b3e;
            --error-bg: #fcdde3;
            --error-text: #a01e30;
            --danger: #c42535;
        }
        html[data-theme="light"] body {
            background:
                radial-gradient(circle at 90% 6%, #b6cff5 0%, transparent 38%),
                radial-gradient(circle at 6% 92%, #b8d8f7 0%, transparent 46%),
                var(--bg);
        }
        /* Sidebar: rich navy so it stands out clearly from the light content area */
        html[data-theme="light"] .main-nav {
            background: linear-gradient(160deg, #102045 0%, #1a3468 60%, #1e3f7c 100%);
            border-right: 1px solid #0c1a38;
            box-shadow: 4px 0 24px rgba(8, 20, 55, 0.32);
        }
        html[data-theme="light"] .nav-brand {
            color: #ffffff;
            border-bottom-color: rgba(255, 255, 255, 0.14);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        html[data-theme="light"] .nav-link { color: #c8deff; }
        html[data-theme="light"] .nav-link:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        html[data-theme="light"] .nav-logout-btn { color: #c8deff; }
        html[data-theme="light"] .nav-theme {
            color: #c8deff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }
        html[data-theme="light"] .nav-theme:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        html[data-theme="light"] .nav-menu {
            background: #1a3468;
            border-color: #2a4f8a;
            box-shadow: 0 10px 28px rgba(8, 20, 55, 0.38);
        }
        html[data-theme="light"] .nav-menu a { color: #c8deff; }
        html[data-theme="light"] .nav-menu a:hover { background: rgba(255,255,255,0.1); color: #fff; }
        html[data-theme="light"] .topbar {
            background: rgba(255, 255, 255, 0.96);
            border-color: #afc6e4;
            box-shadow: 0 4px 20px rgba(20, 60, 140, 0.14);
        }
        html[data-theme="light"] .panel {
            background: var(--card);
            border-color: #afc6e4;
            box-shadow: 0 6px 28px rgba(20, 60, 140, 0.12);
        }
        html[data-theme="light"] th { color: #1a4a9c; font-weight: 700; }
        html[data-theme="light"] td { color: var(--text); }
        html[data-theme="light"] .btn-secondary {
            background: #e8f0fb;
            border-color: #afc6e4;
            color: #1a3468;
        }
        html[data-theme="light"] .btn-secondary:hover { background: #d8e6f5; border-color: #7aa4d4; }
        html[data-theme="light"] .btn-danger {
            background: #fce8eb;
            border-color: #f0aab5;
            color: #b01e2c;
        }
        html[data-theme="light"] .btn-danger:hover { background: #fad4d9; border-color: #d8808e; }
        html[data-theme="light"] .form-control {
            background: #f2f7ff;
            border-color: #afc6e4;
            color: #0c1c38;
        }
        html[data-theme="light"] .form-control:focus {
            border-color: #1a6ef5;
            box-shadow: 0 0 0 3px rgba(26, 110, 245, 0.18);
        }
        html[data-theme="light"] .form-grid label { color: #1a3468; }
        html[data-theme="light"] .subtle { color: #3d5270; }
        html[data-theme="light"] .messages li.warning {
            background: #fff4d6; color: #7a5410; border-color: #e8c96a;
        }
        /* Readability pass: most pages define their own dark cards, tables and
           small labels. These shared light-theme rules keep contrast consistent
           without changing layout or behaviour. */
        html[data-theme="light"] {
            --bg: #e7eff9;
            --card: #ffffff;
            --text: #10213d;
            --muted: #415673;
            --line: #b7c9e3;
        }
        html[data-theme="light"] body {
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        html[data-theme="light"] .shell,
        html[data-theme="light"] .topbar,
        html[data-theme="light"] .panel,
        html[data-theme="light"] .content-card,
        html[data-theme="light"] .menu-card,
        html[data-theme="light"] .snap-card,
        html[data-theme="light"] .snapshot-card,
        html[data-theme="light"] .detail-card,
        html[data-theme="light"] .onu-detail-card,
        html[data-theme="light"] .filter-bar,
        html[data-theme="light"] .settings-card,
        html[data-theme="light"] .user-form-card,
        html[data-theme="light"] .user-list-card,
        html[data-theme="light"] .alerts-card,
        html[data-theme="light"] .rep-card,
        html[data-theme="light"] .vlan-add-card,
        html[data-theme="light"] .profile-add-card,
        html[data-theme="light"] .profile-config-box,
        html[data-theme="light"] .authorize-panel,
        html[data-theme="light"] .progress-box,
        html[data-theme="light"] .review-panel {
            background-color: #ffffff;
            color: #10213d;
            border-color: #b7c9e3;
        }
        html[data-theme="light"] h1,
        html[data-theme="light"] h2,
        html[data-theme="light"] h3,
        html[data-theme="light"] h4,
        html[data-theme="light"] .brand,
        html[data-theme="light"] .summary-title,
        html[data-theme="light"] .content-card h3,
        html[data-theme="light"] .snap-title,
        html[data-theme="light"] .detail-row strong,
        html[data-theme="light"] .snapshot-meta strong,
        html[data-theme="light"] .onu-config-table-label {
            color: #10213d;
            font-weight: 800;
        }
        html[data-theme="light"] p,
        html[data-theme="light"] td,
        html[data-theme="light"] li,
        html[data-theme="light"] label,
        html[data-theme="light"] .detail-value,
        html[data-theme="light"] .snapshot-meta span,
        html[data-theme="light"] .signal-line,
        html[data-theme="light"] .metric-note,
        html[data-theme="light"] .dashboard-history-message,
        html[data-theme="light"] .autofind-summary,
        html[data-theme="light"] .multi-filter-item,
        html[data-theme="light"] .search-group label,
        html[data-theme="light"] .authorize-field label,
        html[data-theme="light"] .filter-label {
            color: #1f304d;
        }
        html[data-theme="light"] .subtle,
        html[data-theme="light"] .muted,
        html[data-theme="light"] .muted-cell,
        html[data-theme="light"] .pager-summary,
        html[data-theme="light"] .summary-sub,
        html[data-theme="light"] .metric-label,
        html[data-theme="light"] .metric-note,
        html[data-theme="light"] .status-graph-sub,
        html[data-theme="light"] .dashboard-history-sub,
        html[data-theme="light"] .dashboard-port-traffic-sub,
        html[data-theme="light"] .olt-temp-label,
        html[data-theme="light"] .dashboard-history-time,
        html[data-theme="light"] .running-config-placeholder,
        html[data-theme="light"] .running-config-status,
        html[data-theme="light"] .signal-chart-empty,
        html[data-theme="light"] .authorize-panel-note,
        html[data-theme="light"] .multi-filter-item small {
            color: #4b607d;
        }
        html[data-theme="light"] table {
            color: #10213d;
        }
        html[data-theme="light"] th,
        html[data-theme="light"] .cards-table th,
        html[data-theme="light"] .onu-config-table th,
        html[data-theme="light"] .rv-table th {
            color: #254a84;
            background: #edf4ff;
            border-bottom-color: #b7c9e3;
            font-weight: 800;
        }
        html[data-theme="light"] td,
        html[data-theme="light"] .cards-table td,
        html[data-theme="light"] .onu-config-table td,
        html[data-theme="light"] .rv-table td {
            color: #172946;
            border-bottom-color: #d6e2f2;
            font-weight: 600;
        }
        html[data-theme="light"] tr:hover td {
            background: rgba(47, 128, 255, 0.07);
        }
        html[data-theme="light"] a,
        html[data-theme="light"] .detail-link,
        html[data-theme="light"] .detail-edit,
        html[data-theme="light"] .sp-onu-link {
            color: #0f5fc9;
            font-weight: 800;
        }
        html[data-theme="light"] a:hover {
            color: #073f91;
        }
        html[data-theme="light"] input,
        html[data-theme="light"] select,
        html[data-theme="light"] textarea,
        html[data-theme="light"] .form-control,
        html[data-theme="light"] .search-input,
        html[data-theme="light"] .search-select,
        html[data-theme="light"] .dashboard-port-traffic-select,
        html[data-theme="light"] .multi-filter summary,
        html[data-theme="light"] .multi-filter-search input {
            background: #ffffff;
            color: #10213d;
            border-color: #8eabd2;
            font-weight: 700;
        }
        html[data-theme="light"] input::placeholder,
        html[data-theme="light"] textarea::placeholder {
            color: #6c7f9a;
            opacity: 1;
        }
        html[data-theme="light"] input:disabled,
        html[data-theme="light"] select:disabled,
        html[data-theme="light"] textarea:disabled {
            background: #e9f0fa;
            color: #435976;
            -webkit-text-fill-color: #435976;
            opacity: 1;
        }
        html[data-theme="light"] .running-config-output,
        html[data-theme="light"] .progress-log,
        html[data-theme="light"] .debug-panel {
            background: #f8fbff;
            color: #12345f;
            border-color: #b7c9e3;
        }
        html[data-theme="light"] .status-graph-canvas,
        html[data-theme="light"] .dashboard-port-traffic-canvas,
        html[data-theme="light"] .signal-chart-wrap {
            background: #fbfdff;
            border-color: #d2dfef;
        }
        html[data-theme="light"] .btn-secondary,
        html[data-theme="light"] .status-graph-btn,
        html[data-theme="light"] .signal-range-btn,
        html[data-theme="light"] .sp-tab,
        html[data-theme="light"] .al-tab {
            background: #eef5ff;
            color: #17365f;
            border-color: #a9c0df;
            font-weight: 800;
        }
        html[data-theme="light"] .btn-primary,
        html[data-theme="light"] .btn-success,
        html[data-theme="light"] .status-graph-btn.active,
        html[data-theme="light"] .signal-range-btn.active,
        html[data-theme="light"] .sp-tab.active,
        html[data-theme="light"] .al-tab.active {
            color: #ffffff;
            font-weight: 800;
        }
        html[data-theme="light"] .badge,
        html[data-theme="light"] .sn-pill,
        html[data-theme="light"] .vlan-chip,
        html[data-theme="light"] .agg-chip,
        html[data-theme="light"] .role-badge,
        html[data-theme="light"] .alert-widget-count,
        html[data-theme="light"] .olt-uptime-pill {
            font-weight: 800;
            border-color: rgba(22, 45, 80, 0.16);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body{% if user.is_authenticated %} class="authenticated"{% endif %}>
    {% if user.is_authenticated %}
    <header class="main-nav">
        <div class="nav-inner">
            <a href="{% url 'olt_list' %}" class="nav-brand" aria-label="Home">OptiVerse</a>
            <nav class="nav-links">
                <a href="{% url 'unconfigured_onus' %}" class="nav-link">Autofind</a>
                <a href="{% url 'configured_onus' %}" class="nav-link">ONUs</a>
                <a href="{% url 'olt_settings_olt' %}" class="nav-link">OLT</a>
                <a href="{% url 'health_report' %}" class="nav-link">Report</a>
                {% if user.is_staff or user.is_superuser %}
                <a href="{% url 'settings_home' %}" class="nav-link">Settings</a>
                {% endif %}
            </nav>
            <button type="button" class="nav-link nav-theme" id="themeToggleBtn" aria-label="Toggle light or dark theme">
                <span class="theme-ico" data-theme-ico>🌙</span>
                <span data-theme-label>Dark</span>
            </button>
            <form method="post" action="{% url 'logout' %}" class="nav-logout">
                {% csrf_token %}
                <button type="submit" class="nav-link nav-logout-btn">Log out</button>
            </form>
        </div>
    </header>
    {% endif %}
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
    <script>
        (function () {
            var btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            var root = document.documentElement;
            var ico = btn.querySelector('[data-theme-ico]');
            var label = btn.querySelector('[data-theme-label]');
            function sync() {
                var light = root.getAttribute('data-theme') === 'light';
                // Show the option the user will switch TO.
                if (ico) ico.textContent = light ? '🌙' : '☀️';
                if (label) label.textContent = light ? 'Dark' : 'Light';
            }
            sync();
            btn.addEventListener('click', function () {
                var light = root.getAttribute('data-theme') === 'light';
                try {
                    if (light) {
                        root.removeAttribute('data-theme');
                        localStorage.setItem('oltTheme', 'dark');
                    } else {
                        root.setAttribute('data-theme', 'light');
                        localStorage.setItem('oltTheme', 'light');
                    }
                } catch (e) {
                    if (light) { root.removeAttribute('data-theme'); } else { root.setAttribute('data-theme', 'light'); }
                }
                sync();
            });
        })();
    </script>
</body>
</html>
